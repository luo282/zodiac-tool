<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>账号管理 — 动物号码累计工具</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{
  font-family:'Microsoft YaHei','微软雅黑',sans-serif;
  background:#0d1b2a;
  color:#e0e6f0;
  min-height:100vh;
}

/* 背景效果 */
body::before{
  content:'';position:fixed;top:0;left:0;width:100%;height:100%;
  background:
    radial-gradient(ellipse at 20% 50%, rgba(37,99,235,0.12) 0%, transparent 50%),
    radial-gradient(ellipse at 80% 20%, rgba(139,92,246,0.08) 0%, transparent 50%),
    radial-gradient(ellipse at 50% 80%, rgba(16,185,129,0.06) 0%, transparent 50%);
  z-index:0;
  pointer-events:none;
}

/* 顶部导航 */
.top-bar{
  position:sticky;top:0;z-index:10;
  background:rgba(10,22,40,0.95);
  border-bottom:1px solid #1e3a60;
  padding:12px 24px;
  display:flex;align-items:center;justify-content:space-between;
  backdrop-filter:blur(10px);
}
.top-bar .left{display:flex;align-items:center;gap:16px;}
.top-bar .logo{
  font-size:18px;color:#f0c040;font-weight:bold;letter-spacing:2px;
  text-shadow:0 0 15px rgba(240,192,64,0.3);
}
.top-bar .role-badge{
  background:linear-gradient(135deg,#7c3aed,#6d28d9);
  color:#fff;padding:4px 12px;border-radius:20px;font-size:11px;
  letter-spacing:1px;
}
.top-bar .right{display:flex;gap:10px;}
.top-bar button{
  padding:8px 18px;border:1px solid #1e3a60;border-radius:8px;
  background:transparent;color:#7ca8d0;font-size:13px;cursor:pointer;
  transition:all .2s;font-family:inherit;
}
.top-bar button:hover{border-color:#3b82f6;color:#3b82f6;background:rgba(37,99,235,0.1);}
.top-bar button.danger{border-color:#dc2626;color:#ef4444;}
.top-bar button.danger:hover{background:rgba(220,38,38,0.1);}

/* 主容器 */
.container{
  position:relative;z-index:1;
  max-width:800px;margin:30px auto;padding:0 20px;
}

/* Token 配置区 */
.token-card{
  background:linear-gradient(145deg, #0e1f35 0%, #0a1628 100%);
  border:1px solid #1e3a60;border-radius:16px;
  padding:24px;margin-bottom:24px;
}
.token-card h2{
  font-size:16px;color:#f0c040;margin-bottom:12px;letter-spacing:1px;
  display:flex;align-items:center;gap:8px;
}
.token-card p{font-size:12px;color:#5a7a9a;margin-bottom:12px;line-height:1.6;}
.token-row{display:flex;gap:8px;margin-bottom:8px;}
.token-row input{
  flex:1;padding:10px 14px;
  background:#0a1628;border:1px solid #1e3a60;border-radius:8px;
  color:#e0e6f0;font-size:13px;font-family:inherit;outline:none;
}
.token-row input:focus{border-color:#2563eb;box-shadow:0 0 8px rgba(37,99,235,0.2);}
.token-btn{
  padding:8px 16px;border:none;border-radius:8px;
  font-size:12px;cursor:pointer;color:#fff;white-space:nowrap;
  transition:all .2s;
}
.token-btn.save{background:#059669;}
.token-btn.save:hover{background:#047857;}
.token-btn.clear{background:#dc2626;}
.token-btn.clear:hover{background:#b91c1c;}
.token-status{font-size:12px;margin-top:6px;}
.token-status.ok{color:#10b981;}
.token-status.no{color:#ef4444;}
.token-status.loading{color:#3b82f6;}

/* 账号管理区 */
.accounts-card{
  background:linear-gradient(145deg, #0e1f35 0%, #0a1628 100%);
  border:1px solid #1e3a60;border-radius:16px;
  padding:24px;
}
.accounts-card h2{
  font-size:16px;color:#f0c040;margin-bottom:16px;letter-spacing:1px;
  display:flex;align-items:center;gap:8px;
}

/* 账号表格 */
.account-table{
  width:100%;border-collapse:separate;border-spacing:0;
  margin-bottom:20px;
}
.account-table thead th{
  text-align:left;padding:10px 12px;
  font-size:12px;color:#5a7a9a;letter-spacing:1px;
  border-bottom:1px solid #1e3a60;
  background:#0a1628;
}
.account-table thead th:first-child{border-radius:8px 0 0 0;}
.account-table thead th:last-child{border-radius:0 8px 0 0;}
.account-table tbody td{
  padding:12px;font-size:13px;
  border-bottom:1px solid rgba(30,58,96,0.5);
}
.account-table tbody tr:hover{background:rgba(37,99,235,0.05);}
.account-table .username{color:#f0c040;font-weight:bold;}
.account-table .role-tag{
  display:inline-block;padding:2px 10px;border-radius:12px;font-size:11px;
}
.account-table .role-tag.admin{
  background:rgba(124,58,237,0.2);color:#a78bfa;border:1px solid rgba(124,58,237,0.3);
}
.account-table .role-tag.user{
  background:rgba(16,185,129,0.15);color:#6ee7b7;border:1px solid rgba(16,185,129,0.3);
}
.account-table .password{color:#5a7a9a;font-family:monospace;}
.account-table .actions{display:flex;gap:6px;}
.account-table .actions button{
  padding:5px 12px;border:none;border-radius:6px;
  font-size:11px;cursor:pointer;color:#fff;transition:all .2s;
}
.btn-edit{background:#7c3aed;}
.btn-edit:hover{background:#6d28d9;}
.btn-del{background:#dc2626;}
.btn-del:hover{background:#b91c1c;}
.btn-del:disabled{opacity:0.3;cursor:not-allowed;}

/* 添加账号区 */
.add-section{
  margin-top:4px;padding:20px;
  background:#0a1628;border:1px dashed #1e3a60;border-radius:12px;
}
.add-section h3{font-size:14px;color:#7ca8d0;margin-bottom:14px;}
.add-grid{
  display:grid;grid-template-columns:1fr 1fr 120px;gap:10px;margin-bottom:12px;
}
.add-grid input,.add-grid select{
  padding:10px 14px;background:#0d1b2a;border:1px solid #1e3a60;
  border-radius:8px;color:#e0e6f0;font-size:13px;font-family:inherit;outline:none;
}
.add-grid input:focus,.add-grid select:focus{
  border-color:#2563eb;box-shadow:0 0 8px rgba(37,99,235,0.2);
}
.add-grid select{cursor:pointer;}
.add-grid select option{background:#0d1b2a;color:#e0e6f0;}
.add-btn{
  width:100%;padding:12px;border:none;border-radius:10px;
  background:linear-gradient(135deg,#059669,#10b981);
  color:#fff;font-size:14px;font-weight:bold;letter-spacing:2px;
  cursor:pointer;transition:all .2s;
}
.add-btn:hover{background:linear-gradient(135deg,#047857,#059669);transform:translateY(-1px);}
.add-btn:disabled{opacity:0.5;cursor:not-allowed;transform:none;}

/* 弹窗 */
.modal-overlay{
  display:none;position:fixed;top:0;left:0;width:100%;height:100%;
  background:rgba(0,0,0,0.7);z-index:100;
  align-items:center;justify-content:center;
}
.modal-overlay.show{display:flex;}
.modal-box{
  background:#0e1f35;border:1px solid #1e3a60;border-radius:16px;
  padding:28px;width:400px;max-width:90vw;
  box-shadow:0 20px 60px rgba(0,0,0,0.5);
}
.modal-box h3{color:#f0c040;font-size:16px;margin-bottom:18px;letter-spacing:1px;}
.modal-box .form-group{margin-bottom:14px;}
.modal-box .form-group label{
  display:block;font-size:12px;color:#7ca8d0;margin-bottom:6px;letter-spacing:1px;
}
.modal-box .form-group input{
  width:100%;padding:10px 14px;
  background:#0a1628;border:1px solid #1e3a60;border-radius:8px;
  color:#e0e6f0;font-size:14px;font-family:inherit;outline:none;
}
.modal-box .form-group input:focus{border-color:#2563eb;box-shadow:0 0 8px rgba(37,99,235,0.2);}
.modal-msg{font-size:12px;min-height:18px;margin-top:4px;}
.modal-msg.error{color:#ef4444;}
.modal-msg.success{color:#10b981;}
.modal-btns{display:flex;gap:10px;margin-top:18px;}
.modal-btns button{
  flex:1;padding:11px;border:none;border-radius:10px;
  font-size:14px;cursor:pointer;color:#fff;font-weight:bold;
  transition:all .2s;
}
.modal-btns .confirm{background:linear-gradient(135deg,#2563eb,#3b82f6);}
.modal-btns .confirm:hover{background:linear-gradient(135deg,#1d4ed8,#2563eb);}
.modal-btns .cancel{background:#374151;}
.modal-btns .cancel:hover{background:#4b5563;}

/* 提示 */
.hint{
  text-align:center;padding:40px 20px;
  color:#3a5a7a;font-size:14px;
}
.hint .icon{font-size:40px;margin-bottom:12px;display:block;}

/* 响应式 */
@media(max-width:600px){
  .add-grid{grid-template-columns:1fr;}
  .top-bar{padding:10px 14px;}
  .container{margin:16px auto;padding:0 12px;}
  .account-table{font-size:11px;}
  .account-table .actions{flex-direction:column;gap:4px;}
}
</style>
</head>
<body>

<!-- 顶部导航 -->
<div class="top-bar">
  <div class="left">
    <span class="logo">🔐 账号管理中心</span>
    <span class="role-badge" id="roleBadge">管理员</span>
  </div>
  <div class="right">
    <button onclick="goToTool()">📊 进入工具</button>
    <button class="danger" onclick="doLogout()">🚪 退出登录</button>
  </div>
</div>

<!-- 主内容 -->
<div class="container">

  <!-- Token 配置 -->
  <div class="token-card">
    <h2>🔑 GitHub Token 配置</h2>
    <p>配置 GitHub Token 后才能修改账号密码。Token 仅存储在当前浏览器，其他设备无法操作。<br>
       需要 Fine-grained PAT 权限：Contents (Read and write)、Administration、Pages。</p>
    <div class="token-row">
      <input type="password" id="tokenInput" placeholder="粘贴 GitHub Fine-grained PAT Token">
      <button class="token-btn save" onclick="saveToken()">保存 Token</button>
      <button class="token-btn clear" onclick="removeToken()">清除</button>
    </div>
    <div class="token-status" id="tokenStatus"></div>
  </div>

  <!-- 账号管理 -->
  <div class="accounts-card">
    <h2>👥 账号管理</h2>

    <!-- 未配置 Token 时的提示 -->
    <div class="hint" id="noTokenHint">
      <span class="icon">🔒</span>
      请先配置 GitHub Token 才能管理账号
    </div>

    <!-- 账号列表 -->
    <div id="accountSection" style="display:none;">
      <table class="account-table">
        <thead>
          <tr>
            <th>账号</th>
            <th>角色</th>
            <th>密码</th>
            <th>操作</th>
          </tr>
        </thead>
        <tbody id="accountListBody"></tbody>
      </table>

      <!-- 添加新账号 -->
      <div class="add-section">
        <h3>➕ 添加新账号</h3>
        <div class="add-grid">
          <input id="newUser" placeholder="新账号名">
          <input id="newPass" type="password" placeholder="设置密码">
          <select id="newRole">
            <option value="user">普通用户</option>
            <option value="admin">管理员</option>
          </select>
        </div>
        <button class="add-btn" id="addBtn" onclick="doAddAccount()">添 加 账 号</button>
      </div>
    </div>
  </div>
</div>

<!-- 修改密码弹窗 -->
<div class="modal-overlay" id="pwModal">
  <div class="modal-box">
    <h3>✏️ 修改密码</h3>
    <div class="form-group">
      <label>账 号</label>
      <input type="text" id="pwUser" readonly style="opacity:0.6;">
    </div>
    <div class="form-group">
      <label>新密码</label>
      <input type="text" id="pwNew" placeholder="输入新密码">
    </div>
    <div class="form-group">
      <label>确认密码</label>
      <input type="text" id="pwConfirm" placeholder="再次输入新密码">
    </div>
    <div class="modal-msg" id="pwMsg"></div>
    <div class="modal-btns">
      <button class="confirm" onclick="doChangePw()">确认修改</button>
      <button class="cancel" onclick="closePwModal()">取消</button>
    </div>
  </div>
</div>

<script src="auth.js"></script>
<script>
// ===== 权限检查 =====
(function checkAuth() {
  if (!Auth.isLoggedIn()) {
    window.location.href = 'login.html';
    return;
  }
  const user = Auth.currentUser();
  if (!user || user.role !== 'admin') {
    alert('⚠️ 只有管理员才能访问此页面');
    window.location.href = 'index.html';
    return;
  }
  // 显示当前管理员
  document.getElementById('roleBadge').textContent = '管理员: ' + user.username;
})();

// ===== 页面加载后检查 Token =====
checkTokenStatus();

// ===== Token 管理 =====
async function checkTokenStatus() {
  const el = document.getElementById('tokenStatus');
  const hint = document.getElementById('noTokenHint');
  const section = document.getElementById('accountSection');

  if (!Auth.hasToken()) {
    el.className = 'token-status no';
    el.textContent = '❌ 未配置 Token — 无法修改账号密码';
    hint.style.display = 'block';
    section.style.display = 'none';
    return;
  }

  el.className = 'token-status loading';
  el.textContent = '⏳ 验证 Token 中...';

  try {
    const res = await Auth.verifyToken();
    if (res.ok) {
      el.className = 'token-status ok';
      el.textContent = '✅ Token 有效 (GitHub 用户: ' + res.username + ')';
      hint.style.display = 'none';
      section.style.display = 'block';
      loadAccountList();
    } else {
      el.className = 'token-status no';
      el.textContent = '❌ Token 无效: ' + res.msg;
      hint.style.display = 'block';
      section.style.display = 'none';
    }
  } catch (e) {
    el.className = 'token-status no';
    el.textContent = '❌ 验证失败: ' + e.message;
    hint.style.display = 'block';
    section.style.display = 'none';
  }
}

async function saveToken() {
  const t = document.getElementById('tokenInput').value.trim();
  if (!t) { alert('请粘贴 GitHub Token'); return; }
  Auth.configureToken(t);
  document.getElementById('tokenInput').value = '';
  await checkTokenStatus();
}

function removeToken() {
  if (!confirm('确认清除 Token？清除后将无法修改账号密码。')) return;
  Auth.clearToken();
  checkTokenStatus();
}

// ===== 账号列表 =====
async function loadAccountList() {
  const tbody = document.getElementById('accountListBody');
  tbody.innerHTML = '<tr><td colspan="4" style="text-align:center;color:#5a7a9a;padding:20px;">加载中...</td></tr>';

  try {
    const accounts = await Auth.listAccounts();
    tbody.innerHTML = '';
    accounts.forEach(a => {
      const tr = document.createElement('tr');
      const isAdmin = a.username === 'admin';
      const isSelf = Auth.currentUser() && a.username === Auth.currentUser().username;
      tr.innerHTML = `
        <td class="username">${a.username}${isSelf ? ' <span style="color:#5a7a9a;font-size:10px;">(当前)</span>' : ''}</td>
        <td><span class="role-tag ${a.role}">${a.role === 'admin' ? '管理员' : '普通用户'}</span></td>
        <td class="password">••••••</td>
        <td class="actions">
          <button class="btn-edit" onclick="openPwModal('${a.username}')">修改密码</button>
          <button class="btn-del" onclick="doDeleteAccount('${a.username}')" ${isAdmin ? 'disabled title="不能删除默认管理员"' : ''}>删除</button>
        </td>
      `;
      tbody.appendChild(tr);
    });
  } catch (e) {
    tbody.innerHTML = '<tr><td colspan="4" style="color:#ef4444;text-align:center;padding:20px;">加载失败: ' + e.message + '</td></tr>';
  }
}

// ===== 添加账号 =====
async function doAddAccount() {
  const u = document.getElementById('newUser').value.trim();
  const p = document.getElementById('newPass').value;
  const r = document.getElementById('newRole').value;
  const btn = document.getElementById('addBtn');

  if (!u || !p) { alert('请填写账号和密码'); return; }

  btn.disabled = true;
  btn.textContent = '添加中...';

  try {
    const res = await Auth.addAccount(u, p, r);
    alert('✅ ' + res.msg);
    document.getElementById('newUser').value = '';
    document.getElementById('newPass').value = '';
    loadAccountList();
  } catch (e) {
    alert('❌ 添加失败: ' + e.message);
  } finally {
    btn.disabled = false;
    btn.textContent = '添 加 账 号';
  }
}

// ===== 删除账号 =====
async function doDeleteAccount(username) {
  if (username === 'admin') { alert('不能删除默认管理员账号'); return; }
  if (!confirm('确认删除账号 "' + username + '"？此操作不可撤销！')) return;

  try {
    const res = await Auth.deleteAccount(username);
    alert('✅ ' + res.msg);
    loadAccountList();
  } catch (e) {
    alert('❌ 删除失败: ' + e.message);
  }
}

// ===== 修改密码弹窗 =====
function openPwModal(username) {
  document.getElementById('pwUser').value = username;
  document.getElementById('pwNew').value = '';
  document.getElementById('pwConfirm').value = '';
  document.getElementById('pwMsg').textContent = '';
  document.getElementById('pwMsg').className = 'modal-msg';
  document.getElementById('pwModal').classList.add('show');
  document.getElementById('pwNew').focus();
}
function closePwModal() {
  document.getElementById('pwModal').classList.remove('show');
}
async function doChangePw() {
  const u = document.getElementById('pwUser').value;
  const p1 = document.getElementById('pwNew').value;
  const p2 = document.getElementById('pwConfirm').value;
  const msg = document.getElementById('pwMsg');

  if (!p1) { msg.textContent = '请输入新密码'; msg.className = 'modal-msg error'; return; }
  if (p1 !== p2) { msg.textContent = '两次密码不一致'; msg.className = 'modal-msg error'; return; }

  try {
    const res = await Auth.changePassword(u, p1);
    msg.textContent = '✅ ' + res.msg;
    msg.className = 'modal-msg success';
    setTimeout(() => { closePwModal(); loadAccountList(); }, 1200);
  } catch (e) {
    msg.textContent = e.message;
    msg.className = 'modal-msg error';
  }
}

// ===== 导航 =====
function goToTool() {
  window.location.href = 'index.html';
}
function doLogout() {
  if (!confirm('确认退出登录？')) return;
  Auth.logout();
  window.location.href = 'login.html';
}

// ===== 点击弹窗外关闭 =====
document.getElementById('pwModal').addEventListener('click', function(e) {
  if (e.target === this) closePwModal();
});
</script>
</body>
</html>
