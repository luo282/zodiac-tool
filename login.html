<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>登录 — 动物号码累计工具</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{
  font-family:'Microsoft YaHei','微软雅黑',sans-serif;
  background:#0d1b2a;
  color:#e0e6f0;
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
}

/* 背景粒子效果 */
body::before{
  content:'';position:fixed;top:0;left:0;width:100%;height:100%;
  background:
    radial-gradient(ellipse at 20% 50%, rgba(37,99,235,0.15) 0%, transparent 50%),
    radial-gradient(ellipse at 80% 20%, rgba(139,92,246,0.1) 0%, transparent 50%),
    radial-gradient(ellipse at 50% 80%, rgba(16,185,129,0.08) 0%, transparent 50%);
  z-index:0;
}

.login-card{
  position:relative;z-index:1;
  background:linear-gradient(145deg, #0e1f35 0%, #0a1628 100%);
  border:1px solid #1e3a60;
  border-radius:20px;
  padding:48px 40px;
  width:420px;
  max-width:92vw;
  box-shadow:0 25px 60px rgba(0,0,0,0.5), 0 0 80px rgba(37,99,235,0.1);
}

.login-card h1{
  text-align:center;
  font-size:22px;
  color:#f0c040;
  letter-spacing:3px;
  margin-bottom:6px;
  text-shadow:0 0 20px #f0c04055;
}
.login-card .subtitle{
  text-align:center;font-size:12px;color:#5a7a9a;margin-bottom:32px;
}

.form-group{margin-bottom:20px;}
.form-group label{
  display:block;font-size:13px;color:#7ca8d0;margin-bottom:6px;letter-spacing:1px;
}
.form-group input{
  width:100%;padding:12px 16px;
  background:#0a1628;border:1px solid #1e3a60;border-radius:10px;
  color:#e0e6f0;font-size:15px;font-family:inherit;
  transition:border-color .2s,box-shadow .2s;
  outline:none;
}
.form-group input:focus{
  border-color:#2563eb;
  box-shadow:0 0 12px rgba(37,99,235,0.3);
}
.form-group input::placeholder{color:#3a5a7a;}

.login-btn{
  width:100%;padding:14px;border:none;border-radius:12px;
  background:linear-gradient(135deg,#2563eb,#3b82f6);
  color:#fff;font-size:16px;font-weight:bold;letter-spacing:2px;
  cursor:pointer;transition:all .25s;margin-top:8px;
}
.login-btn:hover{
  background:linear-gradient(135deg,#1d4ed8,#2563eb);
  transform:translateY(-2px);
  box-shadow:0 8px 25px rgba(37,99,235,0.4);
}
.login-btn:active{transform:translateY(0);}
.login-btn:disabled{
  opacity:0.5;cursor:not-allowed;transform:none;
  box-shadow:none;
}

.msg{
  text-align:center;font-size:13px;margin-top:14px;
  min-height:20px;transition:all .3s;
}
.msg.error{color:#ef4444;}
.msg.success{color:#10b981;}
.msg.info{color:#3b82f6;}
</style>
</head>
<body>

<div class="login-card">
  <h1>🔐 登录验证</h1>
  <p class="subtitle">动物号码实时累计工具</p>

  <div class="form-group">
    <label>账 号</label>
    <input type="text" id="username" placeholder="请输入账号" autocomplete="username">
  </div>
  <div class="form-group">
    <label>密 码</label>
    <input type="password" id="password" placeholder="请输入密码" autocomplete="current-password">
  </div>
  <button class="login-btn" id="loginBtn" onclick="doLogin()">登 录</button>
  <div class="msg" id="msg"></div>
</div>

<script src="auth.js"></script>
<script>
// ===== 已登录则跳转 =====
(function() {
  if (Auth.isLoggedIn()) {
    const user = Auth.currentUser();
    if (user && user.role === 'admin') {
      window.location.href = 'admin.html';
    } else {
      window.location.href = 'index.html';
    }
  }
})();

// ===== 回车登录 =====
document.getElementById('password').addEventListener('keydown', e => {
  if (e.key === 'Enter') doLogin();
});
document.getElementById('username').addEventListener('keydown', e => {
  if (e.key === 'Enter') document.getElementById('password').focus();
});

// ===== 登录 =====
async function doLogin() {
  const u = document.getElementById('username').value.trim();
  const p = document.getElementById('password').value;
  const btn = document.getElementById('loginBtn');
  const msg = document.getElementById('msg');

  if (!u || !p) { showMsg(msg, '请输入账号和密码', 'error'); return; }

  btn.disabled = true;
  btn.textContent = '验证中...';
  showMsg(msg, '正在验证...', 'info');

  try {
    const res = await Auth.login(u, p);
    if (res.ok) {
      // 管理员跳转到管理页面，普通用户跳转到工具页面
      const target = res.user.role === 'admin' ? 'admin.html' : 'index.html';
      showMsg(msg, '登录成功，正在跳转...', 'success');
      setTimeout(() => { window.location.href = target; }, 600);
    } else {
      showMsg(msg, res.msg, 'error');
    }
  } catch (e) {
    showMsg(msg, '登录失败: ' + e.message, 'error');
  } finally {
    btn.disabled = false;
    btn.textContent = '登 录';
  }
}

function showMsg(el, text, type) {
  el.textContent = text;
  el.className = 'msg ' + (type || '');
}
</script>
</body>
</html>
